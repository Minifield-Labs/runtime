name: Build runtime

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
      timezone: America/Toronto
  pull_request:
    paths:
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-build-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  native:
    name: Native (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            executable-suffix: ""
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            executable-suffix: ""
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            executable-suffix: ""
          - target: aarch64-apple-darwin
            runner: macos-15
            executable-suffix: ""
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            executable-suffix: .exe
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            executable-suffix: .exe
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: ${{ matrix.target }}
      - name: Build runtime libraries and native CLI
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: >-
          cargo build --locked --release --target "$BUILD_TARGET"
          --workspace --exclude minifield-web-demo --exclude minifield-evaluation
      - name: Package native CLI
        env:
          BUILD_TARGET: ${{ matrix.target }}
          EXECUTABLE_SUFFIX: ${{ matrix.executable-suffix }}
        run: |
          package="minifield-infer-$BUILD_TARGET"
          mkdir -p "dist/$package"
          cp "target/$BUILD_TARGET/release/minifield-infer$EXECUTABLE_SUFFIX" "dist/$package/"
          cp LICENSE THIRD_PARTY.md "dist/$package/"
          printf '%s\n' "$GITHUB_SHA" > "dist/$package/REVISION"
          tar -czf "dist/$package.tar.gz" -C dist "$package"
      - name: Upload native CLI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: minifield-infer-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  wasm:
    name: Browser (wasm32-unknown-unknown)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # wasm-bindgen needs symbol names while generating the JavaScript bindings.
      CARGO_PROFILE_RELEASE_STRIP: debuginfo
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked browser build dependencies
        run: npm ci
      - name: Build browser runtime
        run: >-
          cargo build --locked --release --target wasm32-unknown-unknown
          -p minifield-web-demo
      - name: Install matching wasm-bindgen CLI
        run: |
          version=$(sed -nE 's/^wasm-bindgen = "=([^"]+)"/\1/p' web/Cargo.toml)
          test -n "$version"
          archive="wasm-bindgen-$version-x86_64-unknown-linux-musl.tar.gz"
          release="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$version"
          mkdir -p "$RUNNER_TEMP/wasm-bindgen" "$RUNNER_TEMP/gh-release"
          curl --fail --location --retry 3 "$release/$archive" -o "$RUNNER_TEMP/gh-release/$archive"
          curl --fail --location --retry 3 "$release/$archive.sha256sum" -o "$RUNNER_TEMP/$archive.sha256sum"
          (cd "$RUNNER_TEMP" && sha256sum --check "$archive.sha256sum")
          tar -xzf "$RUNNER_TEMP/gh-release/$archive" --strip-components=1 -C "$RUNNER_TEMP/wasm-bindgen"
          echo "$RUNNER_TEMP/wasm-bindgen" >> "$GITHUB_PATH"
      - name: Generate browser bindings and package
        run: |
          package=minifield-web-wasm32-unknown-unknown
          npm run build:web
          mkdir -p "dist/$package/pkg"
          cp -R web/pkg/. "dist/$package/pkg/"
          cp LICENSE THIRD_PARTY.md "dist/$package/"
          printf '%s\n' "$GITHUB_SHA" > "dist/$package/REVISION"
          tar -czf "dist/$package.tar.gz" -C dist "$package"
      - name: Upload browser runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: minifield-web-wasm32-unknown-unknown
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  cloudflare:
    name: Publish runtime to Cloudflare R2
    needs: [native, wasm]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: minifield-cdn
      R2_PUBLIC_URL: ${{ vars.CLOUDFLARE_R2_PUBLIC_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Check Cloudflare configuration
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID repository variable}"
          : "${AWS_ACCESS_KEY_ID:?Set the R2_ACCESS_KEY_ID repository secret}"
          : "${AWS_SECRET_ACCESS_KEY:?Set the R2_SECRET_ACCESS_KEY repository secret}"
          aws --version
      - name: Choose release version
        id: release
        run: |
          version="$(TZ=America/Toronto date +%Y.%m.%d).$GITHUB_RUN_NUMBER"
          if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            version="$version-r$GITHUB_RUN_ATTEMPT"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Download this build's runtime packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: minifield-*
          path: artifacts
          merge-multiple: true
      - name: Prepare CDN assets and package checksums
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p extracted cloudflare
          tar -xzf artifacts/minifield-web-wasm32-unknown-unknown.tar.gz \
            --strip-components=1 -C extracted
          test "$(cat extracted/REVISION)" = "$GITHUB_SHA"
          cp -R extracted/pkg/. cloudflare/
          cp extracted/LICENSE extracted/THIRD_PARTY.md extracted/REVISION cloudflare/
          printf '%s\n' "$RELEASE_VERSION" > cloudflare/VERSION
          test -s cloudflare/minifield_web_demo.js
          test -s cloudflare/minifield_web_demo_bg.wasm
          (cd artifacts && sha256sum ./*.tar.gz > SHA256SUMS)
      - name: Upload assets and packages to Cloudflare
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          endpoint="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          prefix="minifield-runtime/releases/$RELEASE_VERSION"
          destination="s3://$R2_BUCKET/$prefix"
          cache_control='public,max-age=31536000,immutable'
          aws s3 cp cloudflare/ "$destination/" --recursive --exclude '*.wasm' \
            --endpoint-url "$endpoint" --cache-control "$cache_control" --only-show-errors
          aws s3 cp cloudflare/minifield_web_demo_bg.wasm "$destination/minifield_web_demo_bg.wasm" \
            --endpoint-url "$endpoint" --content-type application/wasm \
            --cache-control "$cache_control" --only-show-errors
          aws s3 cp artifacts/ "$destination/downloads/" --recursive --exclude '*' --include '*.tar.gz' \
            --endpoint-url "$endpoint" --content-type application/gzip \
            --cache-control "$cache_control" --only-show-errors
          aws s3 cp artifacts/SHA256SUMS "$destination/downloads/SHA256SUMS" \
            --endpoint-url "$endpoint" --content-type text/plain \
            --cache-control "$cache_control" --only-show-errors
          printf 'Cloudflare R2 release: `%s/`\n' "$destination" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$R2_PUBLIC_URL" ]; then
            public_url="${R2_PUBLIC_URL%/}/$prefix"
            printf '\nRuntime JS: %s/minifield_web_demo.js\n\nRuntime WASM: %s/minifield_web_demo_bg.wasm\n\nPackages and checksums: %s/downloads/\n' \
              "$public_url" "$public_url" "$public_url" >> "$GITHUB_STEP_SUMMARY"
          fi
