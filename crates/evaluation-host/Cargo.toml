[package]
name = "minifield-evaluation"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "minifield-eval"
path = "src/main.rs"

[features]
default = []
wgpu = ["dep:minifield-backend-wgpu"]
metal = ["dep:minifield-backend-metal"]

[dependencies]
minifield-engine-api = { path = "../engine-api" }
minifield-executor-core = { path = "../executor-core" }
minifield-text-tokenizer = { path = "../text-tokenizer" }
minifield-backend-cpu = { path = "../backend-cpu" }
minifield-backend-wgpu = { path = "../backend-wgpu", optional = true }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"

[target.'cfg(target_os = "macos")'.dependencies]
minifield-backend-metal = { path = "../backend-metal", optional = true }

[lints]
workspace = true
