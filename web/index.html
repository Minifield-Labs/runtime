<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minifield runtime — browser decode demo</title>
<style>
  :root {
    --bg: #0b0c0d;
    --fg: #efeeeb;
    --dim: #8a8a86;
    --accent: #f09169;
    --line: #24262a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 14px;
    line-height: 1.55;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }
  main { width: 100%; max-width: 720px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--dim); margin: 0 0 28px; }
  label { display: block; color: var(--dim); font-size: 12px; margin-bottom: 6px; }
  textarea {
    width: 100%;
    height: 96px;
    background: #101114;
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 12px;
    font: inherit;
    resize: vertical;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 12px; align-items: center; margin: 14px 0 24px; }
  button {
    background: var(--accent);
    color: #17130f;
    border: 0;
    border-radius: 6px;
    padding: 9px 18px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.45; cursor: default; }
  button.ghost {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  input[type="number"] {
    width: 72px;
    background: #101114;
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
    font: inherit;
  }
  input[type="text"] {
    flex: 1;
    min-width: 120px;
    background: #101114;
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
    font: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); }
  #status { color: var(--dim); white-space: pre-wrap; }
  #status .ok { color: var(--accent); }
  #out {
    margin-top: 10px;
    min-height: 120px;
    border-top: 1px solid var(--line);
    padding-top: 18px;
  }
  .tok {
    display: inline-block;
    margin: 2px 3px 2px 0;
    padding: 1px 6px;
    border: 1px solid var(--line);
    border-radius: 4px;
    white-space: pre-wrap;
  }
  .id {
    color: var(--accent);
    font-size: 11px;
    margin-right: 6px;
  }
  .err { color: #e06c5f; }
</style>
</head>
<body>
<main>
  <h1>LFM2.5-230M &middot; packed ternary &middot; WebGPU</h1>
  <p class="sub">All inference runs locally in this tab. The naive ternary export is a
  speed fixture, not a quality bar &mdash; expect confident nonsense.</p>

  <label for="prompt">Prompt</label>
  <textarea id="prompt">The meeting has been moved to</textarea>
  <div class="row">
    <button id="go" disabled>Generate</button>
    <button id="goJson" disabled class="ghost">Tool call</button>
    <input id="tools" type="text" value="create_task, archive_task, reorder_list, assign_owner"
      title="registered tool names, comma-separated">
    <span>max</span>
    <input id="max" type="number" value="80" min="1" max="400">
    <span id="status">loading&hellip;</span>
  </div>
  <div id="out"></div>
</main>
<script type="module" src="./main.js"></script>
</body>
</html>
