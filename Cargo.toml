[workspace]
members = [
    "crates/engine-api",
    "crates/backend-wgpu",
    "crates/backend-cpu",
    "crates/kernels-simd",
    "crates/executor-core",
    "crates/text-tokenizer",
    "crates/text-generation",
    "crates/infer-cli",
    "crates/json-grammar",
    "crates/decoding-protocol",
    "web",
]
exclude = [
    "tools/quant-reference",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
