[package]
name = "minifield-web-demo"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Browser WebGPU demo harness for the Minifield inference runtime"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
minifield-engine-api = { path = "../engines/engine-api" }
minifield-backend-wgpu = { path = "../engines/backend-wgpu" }
minifield-executor-core = { path = "../crates/executor-core" }
minifield-json-grammar = { path = "../crates/json-grammar" }
minifield-text-generation = { path = "../crates/text-generation" }
minifield-text-tokenizer = { path = "../crates/text-tokenizer" }
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
js-sys = "=0.3.104"
sha2 = "=0.10.9"

[lints]
workspace = true
