[package]
name = "minifield-backend-wgpu"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Nonblocking wgpu F32 inference operations for the portable executor"

[dependencies]
minifield-engine-api = { path = "../engine-api" }
pollster = "=0.4.0"
portable-atomic = "=1.13.1"
wgpu = "=30.0.1"

[dev-dependencies]
minifield-backend-cpu = { path = "../backend-cpu" }
minifield-executor-core = { path = "../executor-core" }
sha2 = "=0.10.9"

[lints]
workspace = true

[features]
experimental-kernels = []

[[test]]
name = "lowbits"
required-features = ["experimental-kernels"]
